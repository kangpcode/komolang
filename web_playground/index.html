<!DOCTYPE html>

<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground Online Komolang 🦎 - Jalankan Kode di Browser (WASM)</title>
  <meta name="description" content="Taman bermain daring interaktif resmi bahasa pemrograman Komolang berbasis WebAssembly. Tulis, jalankan, dan pelajari Komolang langsung dari peramban Anda.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(19, 26, 42, 0.75);
      --border-color: rgba(99, 102, 241, 0.2);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --green-glow: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-dark) 60%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      background: rgba(9, 13, 22, 0.8);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.35rem;
      font-weight: 700;
    }

    .brand-badge {
      font-size: 0.75rem;
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid var(--accent);
      color: #a5b4fc;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    select.template-select {
      background: #0f172a;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    select.template-select:focus {
      border-color: var(--accent);
    }

    button.btn-run {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      color: white;
      padding: 0.55rem 1.4rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    button.btn-run:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.45);
    }

    main.workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 1.25rem 2rem;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .panel-header {
      padding: 0.75rem 1.25rem;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    textarea#code-editor {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e2e8f0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 1.25rem;
      resize: none;
      tab-size: 4;
    }

    pre#output-console {
      flex: 1;
      padding: 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #38bdf8;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green-glow);
      box-shadow: 0 0 8px var(--green-glow);
    }

    footer {
      padding: 1rem 2rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    @media (max-width: 860px) {
      main.workspace {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🦎 Komolang Playground</span>
      <span class="brand-badge">WASM Edition v1.0</span>
    </div>
    <div class="toolbar">
      <select id="template-select" class="template-select" aria-label="Pilih Contoh Program">
        <option value="halo">1. Halo Dunia</option>
        <option value="fibo">2. Deret Fibonacci (O(n))</option>
        <option value="prima">3. Detektor Bilangan Prima</option>
        <option value="matriks">4. Perkalian Matriks 2D</option>
        <option value="sorting">5. Algoritma QuickSort</option>
        <option value="struktur">6. Objek & Metode Impl</option>
        <option value="konkurensi">7. Konkurensi Saluran Task</option>
      </select>
      <button id="btn-run" class="btn-run">
        <span>▶</span> Jalankan Kode
      </button>
    </div>
  </header>

  <main class="workspace">
    <section class="panel" id="editor-panel">
      <div class="panel-header">
        <span>KODE SUMBER (KOMOLANG)</span>
        <span class="status-indicator">
          <span class="dot"></span> WASM Engine Siap
        </span>
      </div>
      <textarea id="code-editor" spellcheck="false" aria-label="Editor Kode Komolang"></textarea>
    </section>

    <section class="panel" id="console-panel">
      <div class="panel-header">
        <span>OUTPUT KONSOL & PERFORMA</span>
        <span id="exec-time" style="color: #a5b4fc;">⏱ 0.00 ms</span>
      </div>
      <pre id="output-console">// Hasil kompilasi dan eksekusi akan ditampilkan di sini...</pre>
    </section>
  </main>

  <footer>
    <p>Komolang v1.0.0 • Bahasa Pemrograman Kompilasi Native Asli Indonesia • Hak Cipta &copy; 2026 kangpcode</p>
  </footer>

  <script src="playground.js"></script>
</body>
</html>
