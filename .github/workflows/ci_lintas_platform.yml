name: Komolang CI Lintas Platform & Rilis Otomatis

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  matrix-build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            biner: komo
            arsip: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            biner: komo
            arsip: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            biner: komo.exe
            arsip: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            biner: komo
            arsip: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            biner: komo
            arsip: tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pasang Toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Jalankan Suite Pengujian Workspace
        run: cargo test --workspace

      - name: Bangun Biner Rilis
        run: cargo build --release --bin komo --target ${{ matrix.target }}

      - name: Paketkan Biner Rilis
        shell: bash
        run: |
          mkdir -p dist_out
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.biner }}"
          if [ -f "$BIN_PATH" ]; then
            cp "$BIN_PATH" dist_out/
            cd dist_out
            if [ "${{ matrix.arsip }}" = "tar.gz" ]; then
              tar -czf "komolang-${{ matrix.target }}.tar.gz" ${{ matrix.biner }}
            else
              7z a "komolang-${{ matrix.target }}.zip" ${{ matrix.biner }}
            fi
            sha256sum komolang-${{ matrix.target }}.* > SHA256SUMS.txt
          fi

      - name: Unggah Artefak Rilis
        uses: actions/upload-artifact@v4
        with:
          name: komolang-${{ matrix.target }}
          path: dist_out/*
